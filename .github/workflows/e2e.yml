name: E2E tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Playwright image with all browsers and their system libraries preinstalled.
    # Keep the tag in sync with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.49.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: chromium
            name: Full suite (Chromium desktop and phone)
            projects: --project=chromium --project=mobile
          - id: other-browsers
            name: Smoke suite (Firefox and WebKit)
            projects: --project=firefox --project=webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test ${{ matrix.projects }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          path: playwright-report/
          retention-days: 14
