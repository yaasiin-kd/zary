name: E2E tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: chromium
            name: Full suite (Chromium desktop and phone)
            projects: --project=chromium --project=mobile
            browsers: chromium
          - id: other-browsers
            name: Smoke suite (Firefox and WebKit)
            projects: --project=firefox --project=webkit
            browsers: firefox webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Run Playwright tests
        run: npx playwright test ${{ matrix.projects }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          path: playwright-report/
          retention-days: 14
